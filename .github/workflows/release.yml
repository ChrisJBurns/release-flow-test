# Release workflow using releaseo
#
# This workflow automates release PR creation by:
# 1. Bumping the version (major/minor/patch)
# 2. Updating VERSION, Chart.yaml, and values.yaml
# 3. Creating a PR via GitHub API
#
# Usage: Trigger manually from Actions tab or via `gh workflow run release.yml`

name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup helm-docs
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest

      - name: Create Release PR
        id: release
        uses: stacklok/releaseo@v1.0.7
        with:
          bump_type: ${{ inputs.bump_type }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version_files: |
            - file: deploy/charts/release-flow-test/Chart.yaml
              path: version
            - file: deploy/charts/release-flow-test/Chart.yaml
              path: appVersion
            - file: deploy/charts/release-flow-test/values.yaml
              path: image.tag
          helm_docs_args: --chart-search-root=deploy/charts --template-files=README.md.gotmpl --template-files=./_templates.gotmpl

      - name: Summary
        run: |
          echo "## Release PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ steps.release.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.release.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
