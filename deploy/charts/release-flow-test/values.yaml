# Default values for release-flow-test.
# This is a minimal chart for testing release workflows.

image:
  repository: ghcr.io/chrisjburns/release-flow-test
  # tag is updated by the release workflow to match VERSION
  tag: "0.12.0"
  tagUnquoted: 0.12.0
  tagWithPrefixAndQuotes: "v0.12.0"
  tagWithPrefixAndUnquoted: v0.12.0
  imageTagWithPrefixAndQuotes: "ghcr.io/chrisjburns/release-flow-test:v0.12.0"
  imageTagWithPrefix: ghcr.io/chrisjburns/release-flow-test:v0.12.0
  pullPolicy: IfNotPresent
replicaCount: 1
service:
    type: ClusterIP
    port: 8080
resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   cpu: 500m
#   memory: 512Mi

# -- Init containers to run before the main container
# Use this for setup tasks like preparing pgpass files, waiting for dependencies, etc.
# Init containers share the same volumes as the main container (extraVolumes)
initContainers: []
